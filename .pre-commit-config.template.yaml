# .pre-commit-config.template.yaml
#
# Template de hooks pre-commit para projetos baseados em ia-framework.
# Copie para `.pre-commit-config.yaml` na raiz do repo, ajuste stacks ativas
# (comente linhas irrelevantes), e rode uma vez:
#
#   pip install pre-commit      # se ainda nao tem
#   pre-commit install          # instala hooks no .git/hooks/
#   pre-commit autoupdate       # periodicamente para atuzalizar versoes
#
# Para rodar manualmente sem commit:
#   pre-commit run --all-files
#
# Para pular um hook em commit raro (nao faca em SDD):
#   git commit --no-verify      (requer aprovacao explicita do usuario)

repos:
  # Hooks basicos (whitespace, large files, secrets)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=512']
      - id: detect-private-key
      - id: check-case-conflict
      - id: mixed-line-ending
        args: ['--fix=lf']

  # Gitleaks - secret scan
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.0
    hooks:
      - id: gitleaks
        args: ['--config=.gitleaks.toml']  # opcional; default cobre o essencial

