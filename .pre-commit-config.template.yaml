  #       entry: bash -c '! grep -rn "SELECT \*" BD/sql/migrations/'
  #       language: system
  #       files: ^BD/sql/.*\.sql$
  #       pass_filenames: false

  # SDD: impedir commit de segredos em .docx/.pdf de req/
  - repo: local
    hooks:
      - id: req-no-executable
        name: req/ sem binarios executaveis
        entry: bash -c '! find req/ -type f \( -name '*.exe' -o -name '*.dll' -o -name '*.so' \) 2>/dev/null | head -1 | grep -q .'
        language: system
        pass_filenames: false
        always_run: true